<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/dump.css" />
    <link rel="icon" href="icon.png" />
    <title>OneShot Events Viewer</title>
  </head>

  <body>
    <div id="content" class="panel">
      <div id="navigation">
        <a href="%BASE_URL%">&lt; back</a>
        <span id="expand" class="clickable">expand all</span>
        <span id="collapse" class="clickable">collapse all</span>

        <br />

        <span id="dialogue-toggle" class="clickable">
          <span id="dialogue-check">[ ]</span>only dialogue
        </span>
        <span id="inline-toggle" class="clickable">
          <span id="inline-check">[x]</span>show inline
        </span>
      </div>
      <h1 id="status">Loading...</h1>
      <div id="root"></div>
    </div>

    <script type="module" src="src/dump.js"></script>
  </body>
</html>
