<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles/common.css" />
    <link rel="stylesheet" href="styles/dump.css" />
    <link rel="icon" href="icon.png" />
    <title>OneShot Events Viewer</title>
  </head>

  <body>
    <div id="content" class="panel">
      <div class="header">
        <a href="%BASE_URL%">&lt; back</a>
        <button id="expand">Expand all</button>
        <button id="collapse">Collapse all</button>
        <button id="dialogue-toggle">
          <div id="dialogue-check" class="checkbox"></div>
          Filter dialogue
        </button>
        <button id="inline-toggle">
          <div id="inline-check" class="checkbox"></div>
          Show inline
        </button>

        <div>
          <input id="playername" type="text" placeholder="Player" />
          <button id="playername-set">Set name</button>
        </div>
      </div>

      <h1 id="status">Loading...</h1>

      <div id="root"></div>
    </div>

    <script type="module" src="src/dump.js"></script>
  </body>
</html>
